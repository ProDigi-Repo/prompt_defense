[project]
name = "prompt-defense"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Marc Fabian Mezger", email = "57255687+mfmezger@users.noreply.github.com" }
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "agentdojo>=0.1.34",
    "einops>=0.8.1",
    "google-genai>=1.31.0",
    "levenshtein>=0.27.1",
    "load-dotenv>=0.1.0",
    "loguru>=0.7.3",
    "nltk>=3.8",
    "ollama>=0.5.4",
    "openpyxl>=3.1.2",
    "pandas>=2.2.0",
    "rouge-score>=0.1.2",
    "pydantic-ai>=0.8.0",
    "scikit-learn>=1.7.2",
    "sentence-transformers>=5.1.1",
    "transformers>=4.56.2",
    "accelerate>=1.10.1",
]

[project.scripts]
prompt-defense = "prompt_defense:main"

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"
