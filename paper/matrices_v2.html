<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confusion Matrices</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 60px;
            max-width: 1600px;
            margin: 0 auto;
            flex-wrap: wrap;
        }

        .matrix-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .matrix-pair {
            display: flex;
            gap: 20px;
        }

        .matrix {
            display: grid;
            grid-template-columns: 80px 80px;
            grid-template-rows: 80px 80px;
            gap: 2px;
            background-color: #ddd;
            padding: 2px;
            border-radius: 8px;
        }

        .cell {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            color: black;
            border-radius: 4px;
        }

        .matrix-title {
            text-align: center;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Weak matrices -->
        <div class="matrix-group">
            <div class="matrix-pair">
                <div>
                    <div class="matrix-title">0.0/50%</div>
                    <div class="matrix">
                        <div class="cell" style="background-color: #e6f3ff;">17</div>
                        <div class="cell" style="background-color: #ffcccc;">1</div>
                        <div class="cell" style="background-color: #b3d9ff;">4</div>
                        <div class="cell" style="background-color: #0066cc;">113</div>
                    </div>
                </div>
                <div>
                    <div class="matrix-title">0.0/90%</div>
                    <div class="matrix">
                        <div class="cell" style="background-color: #e6f3ff;">1</div>
                        <div class="cell" style="background-color: #ffcccc;">0</div>
                        <div class="cell" style="background-color: #b3d9ff;">15</div>
                        <div class="cell" style="background-color: #0066cc;">105</div>
                    </div>
                </div>
            </div>
            <div class="matrix-pair">
                <div>
                    <div class="matrix-title">0.7/50%</div>
                    <div class="matrix">
                        <div class="cell" style="background-color: #e6f3ff;">16</div>
                        <div class="cell" style="background-color: #ffcccc;">2</div>
                        <div class="cell" style="background-color: #b3d9ff;">5</div>
                        <div class="cell" style="background-color: #0066cc;">114</div>
                    </div>
                </div>
                <div>
                    <div class="matrix-title">0.7/90%</div>
                    <div class="matrix">
                        <div class="cell" style="background-color: #e6f3ff;">0</div>
                        <div class="cell" style="background-color: #ffcccc;">0</div>
                        <div class="cell" style="background-color: #b3d9ff;">20</div>
                        <div class="cell" style="background-color: #0066cc;">116</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Strong matrices -->
        <div class="matrix-group">
            <div class="matrix-pair">
                <div>
                    <div class="matrix-title">0.0/50%</div>
                    <div class="matrix">
                        <div class="cell" style="background-color: #e6f3ff;">2</div>
                        <div class="cell" style="background-color: #ffcccc;">1</div>
                        <div class="cell" style="background-color: #b3d9ff;">1</div>
                        <div class="cell" style="background-color: #0066cc;">128</div>
                    </div>
                </div>
                <div>
                    <div class="matrix-title">0.0/90%</div>
                    <div class="matrix">
                        <div class="cell" style="background-color: #e6f3ff;">0</div>
                        <div class="cell" style="background-color: #ffcccc;">0</div>
                        <div class="cell" style="background-color: #b3d9ff;">4</div>
                        <div class="cell" style="background-color: #0066cc;">125</div>
                    </div>
                </div>
            </div>
            <div class="matrix-pair">
                <div>
                    <div class="matrix-title">0.7/50%</div>
                    <div class="matrix">
                        <div class="cell" style="background-color: #e6f3ff;">2</div>
                        <div class="cell" style="background-color: #ffcccc;">1</div>
                        <div class="cell" style="background-color: #b3d9ff;">1</div>
                        <div class="cell" style="background-color: #0066cc;">98</div>
                    </div>
                </div>
                <div>
                    <div class="matrix-title">0.7/90%</div>
                    <div class="matrix">
                        <div class="cell" style="background-color: #e6f3ff;">0</div>
                        <div class="cell" style="background-color: #ffcccc;">0</div>
                        <div class="cell" style="background-color: #b3d9ff;">3</div>
                        <div class="cell" style="background-color: #0066cc;">114</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
